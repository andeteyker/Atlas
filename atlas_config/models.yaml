# ATLAS Modell-Konfiguration
# Alle Modelle werden via OpenRouter aufgerufen.
# Dokumentation: https://openrouter.ai/models

# Standard-Modell (wird verwendet wenn kein Agent-spezifisches Modell konfiguriert)
default: minimax/minimax-m2.5

# Empfohlene Alternativen (in Kommentaren):
# default: anthropic/claude-3-haiku          # Schnell, günstig
# default: anthropic/claude-3.5-sonnet       # Beste Qualität
# default: google/gemini-flash-1.5           # Schnell + multimodal
# default: mistralai/mistral-7b-instruct     # Lokal hosbar
# default: meta-llama/llama-3.1-8b-instruct  # Open-Source

# Modell pro interne System-Agenten (überschreibt default)
# Domänen-Agenten erben das default-Modell automatisch
agents:
  # Interne System-Agenten
  router: minimax/minimax-m2.5
  spawner: minimax/minimax-m2.5
  learner: minimax/minimax-m2.5
  bootstrap: minimax/minimax-m2.5   # Swarm-Architekt: analysiert Domain + entwirft Team

# Temperatur pro Agent-Typ
# Niedrig (0.0-0.2): Deterministisch — für strukturierte Outputs und Routing
# Mittel (0.3-0.5): Ausgewogen — Standard für die meisten Agenten
# Hoch (0.6-1.0): Kreativ — für Ideenfindung, Generierung, Entwurf
temperature:
  default: 0.3
  router: 0.0        # Deterministisch — nur Agentennamen ausgeben
  learner: 0.1       # Präzise — Regelextraktion
  spawner: 0.5       # Kreativ — Agent-Persönlichkeiten generieren
  bootstrap: 0.7     # Sehr kreativ — Team-Entwurf soll variieren

# Max. Token pro Agent-Typ
max_tokens:
  default: 4096
  bootstrap: 2048    # JSON-Array mit 3-6 Agent-Specs
  spawner: 3000      # 4 Dateien generieren
  learner: 512       # Nur eine kurze Regel
  router: 64         # Nur den Agentennamen
